<!DOCTYPE html>
<html lang="it">

<style>
/* VOICE occasion, hushed: an archive laid out at night
   IDEA a Mnemosyne panel turned into a flying carpet: pictures pinned at random on an endless black plane
   PICTURE the plane itself, images only, sizes by role (boards large, book covers tiny), packed close but never touching, still
   COLOUR black ground, the images are the only colour; "entra nel sito" (bottom right) and the page code under an enlarged image: white, bold, small, thin white outline
   TYPE EB Garamond, as on ri-tagli[e], only for the page code under an enlarged image
   LAYOUT a 2D field of square cells (60px on a phone, up to 108px wide screens), 9 x 9 per tile packed with blocks; drag to fly, pinch to zoom, tap to enlarge; inside the enlarged image pinch, double tap or wheel to zoom further */
  @font-face { font-family: 'EB Garamond'; font-style: normal; font-weight: 700; font-display: swap; src: url('font/eb-garamond-700.woff2') format('woff2'); }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { -webkit-tap-highlight-color: transparent; overscroll-behavior: none; }
  #plane { position: fixed; inset: 0; overflow: hidden; touch-action: none; cursor: grab; user-select: none; -webkit-user-select: none; }
  #plane.drag { cursor: grabbing; }
  #world { position: absolute; left: 0; top: 0; transform-origin: 0 0; will-change: transform; }
  .sc { position: absolute; }                                   /* un riquadro del tappeto */
  .c { position: absolute; }
  .c img {
    display: block; width: 100%; height: 100%;
    cursor: zoom-in; background: #080808;
    opacity: 0; transition: opacity .7s ease;
    -webkit-user-drag: none; user-select: none; -webkit-touch-callout: none; pointer-events: none;
  }
  .c img.ok { opacity: 1; }

  /* ingrandimento */
  #lb { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #lb .bg { position: absolute; inset: 0; background: #000; opacity: 0; transition: opacity .35s ease; }
  #lb.open { pointer-events: auto; cursor: zoom-out; touch-action: none; }
  #lb.open.zoomed { cursor: grab; }
  #lb.open .bg { opacity: .96; }
  #lb img.big { position: absolute; left: 0; top: 0; transform-origin: 0 0; max-width: none; display: block; will-change: transform, opacity; -webkit-user-drag: none; user-select: none; }
  #go {
    position: absolute; left: 50%; top: 0; transform: translateX(-50%);
    font: 700 15px/1 'EB Garamond', Georgia, serif; color: #fff; text-decoration: none; white-space: nowrap;
    padding: 9px 17px 10px; border: 1px solid rgba(255,255,255,.55); border-radius: 999px;
    background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .3s ease, border-color .2s ease;
  }
  #go, #enter { font: 700 15px/1 'EB Garamond', Georgia, serif; color: #fff; text-decoration: none; white-space: nowrap;
    padding: 9px 17px 10px; border: 1px solid rgba(255,255,255,.55); border-radius: 999px; }
  #enter {
    position: fixed; z-index: 5; right: calc(14px + env(safe-area-inset-right)); bottom: calc(14px + env(safe-area-inset-bottom));
    background: rgba(0,0,0,.55); -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
    opacity: 0; transition: opacity .6s ease, border-color .2s ease;
  }
  #enter.on { opacity: 1; }
  body.lbopen #enter { opacity: 0; pointer-events: none; }
  #enter:hover, #enter:focus-visible { border-color: #fff; outline: none; }
  /* quattro frecce a meta' dei bordi: dicono che il piano si muove, spariscono al primo tocco */
  #hint { position: fixed; inset: 0; z-index: 4; pointer-events: none; transition: opacity .6s ease; }
  #hint.off { opacity: 0; }
  #hint .ar { position: absolute; width: 34px; height: 34px; animation: hint 1.9s ease-in-out infinite; filter: drop-shadow(0 0 2px rgba(0,0,0,.9)) drop-shadow(0 0 6px rgba(0,0,0,.6)); }
  #hint .ar::before {
    content: ''; position: absolute; left: 50%; top: 50%; width: 17px; height: 17px; margin: -8.5px 0 0 -8.5px;
    border-top: 2.5px solid #fff; border-left: 2.5px solid #fff; transform: rotate(var(--rot)) translate(3px, 3px);
  }
  #hint .up    { --rot: 45deg;  --dx: 0;    --dy: -6px; left: 50%; margin-left: -17px; top: calc(10px + env(safe-area-inset-top)); }
  #hint .down  { --rot: 225deg; --dx: 0;    --dy: 6px;  left: 50%; margin-left: -17px; bottom: calc(10px + env(safe-area-inset-bottom)); }
  #hint .left  { --rot: -45deg; --dx: -6px; --dy: 0;    top: 50%; margin-top: -17px; left: calc(8px + env(safe-area-inset-left)); }
  #hint .right { --rot: 135deg; --dx: 6px;  --dy: 0;    top: 50%; margin-top: -17px; right: calc(8px + env(safe-area-inset-right)); }
  @keyframes hint {
    0%, 100% { opacity: .35; transform: translate(0, 0); }
    50%      { opacity: 1; transform: translate(var(--dx), var(--dy)); }
  }
  @media (prefers-reduced-motion: reduce) { #hint .ar { animation: none; opacity: .6; } }
  #lb.open #go.on { opacity: 1; pointer-events: auto; }
  #go:hover, #go:focus-visible { border-color: #fff; outline: none; }
</style>
</head>
<body>
<div id="plane" aria-label="tappeto di immagini"><div id="world"></div></div>
<div id="hint" aria-hidden="true"><span class="ar up"></span><span class="ar down"></span><span class="ar left"></span><span class="ar right"></span></div>
<div id="lb" aria-hidden="true"><div class="bg"></div><a id="go"></a></div>
<a id="enter" href="https://sites.google.com/view/ri-taglie">entra nel sito</a>

<!-- elenco delle immagini, generato dalle pagine di ri-tagli[e] -->
<script src="images.js"></script>
<script>
(() => {
  const LIST = (window.TAPPETO || []).filter(x => x && x.n && x.w && x.h);
  if (!LIST.length) return;
  const plane = document.getElementById('plane');
  const world = document.getElementById('world');
  const lb = document.getElementById('lb');
  const lbBg = lb.querySelector('.bg');
  const goBtn = document.getElementById('go');
  const SITE = (window.TAPPETO_SITE || '').replace(/\/$/, '');
  const PREVIEW = window.TAPPETO_PREVIEW || '';
  const pageUrl = it => SITE && it.u ? SITE + it.u : (PREVIEW && it.q ? PREVIEW + it.q + '/preview' : '');
  const enter = document.getElementById('enter');
  if (SITE) enter.href = SITE;
  setTimeout(() => enter.classList.add('on'), 900);

  // a ogni visita un ordine nuovo: tutto il tappeto dipende da questo seme
  const SEED = crypto.getRandomValues(new Uint32Array(1))[0];
  const hash = (a, b, c) => { let h = (a * 374761393 + b * 668265263 + c * 2246822519 + SEED) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return (h ^ (h >>> 16)) >>> 0; };
  const rng = s => () => { s = (s + 0x6D2B79F5) | 0; let t = Math.imul(s ^ (s >>> 15), 1 | s); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; };
  const shuffle = (a, r) => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(r() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

  // le immagini stanno in pacchi (script che chiamano __tp): pNN versioni leggere, hNNx versioni ingrandite.
  // Ogni riquadro del tappeto pesca da un solo pacco leggero, così a ogni spostamento si scarica un file solo.
  // All'arrivo di un pacco ogni sua immagine diventa un indirizzo blob e il pacco stesso si butta.
  const NG = window.TAPPETO_PACKS || 1;
  const R0 = rng(SEED);
  const GROUPS = [...Array(NG)].map(() => ({ L: [], M: [], S: [], XS: [] }));
  LIST.forEach(x => (GROUPS[x.g || 0][x.s] || GROUPS[x.g || 0].M).push(x));
  GROUPS.forEach(G0 => Object.keys(G0).forEach(k => shuffle(G0[k], R0)));
  const GOFF = Math.floor(R0() * NG);
  const groupOf = (sx, sy) => ((((sx * 3 + sy * 5 + GOFF) % NG) + NG) % NG);   // riquadri vicini: pacchi diversi
  const PN = window.TAPPETO_PACKNAMES || [];                  // nomi dei pacchi leggeri (cambiano quando il pacco cambia)
  const pad2 = g => PN[g] || 'p' + String(g).padStart(2, '0');
  const MEMBERS = new Map();                                    // nome del pacco -> [[immagine, inizio, byte, chiave]]
  const addM = (name, x, o, n, key) => { if (!MEMBERS.has(name)) MEMBERS.set(name, []); MEMBERS.get(name).push([x, o, n, key]); };
  LIST.forEach(x => { addM(pad2(x.g || 0), x, x.o, x.n, 'lo'); if (x.H) addM(x.H, x, x.ho, x.hn, 'hi'); });
  const packs = new Map(), waiting = new Map(), URLS = { lo: new Map(), hi: new Map() };
  window.__tp = (name, b64) => {
    name = typeof name === 'number' ? pad2(name) : name;
    const bin = atob(b64), u8 = new Uint8Array(bin.length);
    for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
    for (const [x, o, n, key] of MEMBERS.get(name) || []) URLS[key].set(x, URL.createObjectURL(new Blob([u8.subarray(o, o + n)], { type: 'image/jpeg' })));
    const w = waiting.get(name); if (w) { waiting.delete(name); w(); }
  };
  function pack(name) {
    if (!packs.has(name)) packs.set(name, new Promise((ok, ko) => {
      waiting.set(name, ok);
      const s = document.createElement('script');
      s.src = 'img/' + name + '.js';
      s.onload = () => s.remove();
      s.onerror = () => { packs.delete(name); waiting.delete(name); s.remove(); ko(new Error('pacco ' + name)); };
      document.head.appendChild(s);
    }));
    return packs.get(name);
  }
  const srcOf = x => pack(pad2(x.g || 0)).then(() => URLS.lo.get(x));           // versione leggera
  const hdOf = x => x.H ? pack(x.H).then(() => URLS.hi.get(x)) : Promise.resolve(null);   // versione ingrandita, se c'è
  function sharpen(img, x, still) {                             // passa alla versione ingrandita senza lampi
    hdOf(x).then(u => {
      if (!u) return;
      const hi = new Image();
      hi.onload = () => { if (still()) img.src = u; };
      hi.src = u;
    }).catch(() => {});
  }

  // misura dei blocchi (in celle): quella che segue meglio le proporzioni dell'immagine,
  // con un paio di alternative più piccole se lo spazio non basta
  const BLOCKS = { L: [[4, 3], [5, 3], [3, 3], [3, 4], [3, 5], [4, 4], [5, 4], [4, 5], [2, 3], [3, 2]],
                   M: [[3, 2], [2, 2], [2, 3], [4, 2], [2, 4], [3, 3]],
                   S: [[2, 1], [1, 1], [1, 2], [2, 2]], XS: [[1, 1]] };
  const AREA = { L: 12, M: 5.5, S: 2, XS: 1 };
  const blockMemo = new Map();
  function blocksOf(x) {
    if (blockMemo.has(x)) return blockMemo.get(x);
    const k = BLOCKS[x.s] ? x.s : 'M', ar = x.w / x.h;
    const score = ([w, h]) => Math.abs(Math.log(w / h / ar)) * 2 + Math.abs(Math.log(w * h / AREA[k]));
    const s = [...BLOCKS[k]].sort((a, b) => score(a) - score(b));
    const out = [s[0], ...s.filter(b => b[0] * b[1] < s[0][0] * s[0][1]).slice(0, 2)];
    blockMemo.set(x, out);
    return out;
  }

  let CELL = 60, G = 9, SCW = CELL * G;           // cella e riquadro (G x G celle)
  function sizes() {
    CELL = Math.round(Math.max(60, Math.min(108, innerWidth / 13)));
    SCW = CELL * G;
  }
  sizes();

  // riempie un riquadro (sx, sy) in modo deterministico per questa visita:
  // prima le tavole, poi le medie, poi le piccole, sparse; poi le immagini rimaste del pacco chiudono i buchi
  function layout(sx, sy) {
    const r = rng(hash(sx, sy, 7));
    const GR = GROUPS[groupOf(sx, sy)];
    const occ = new Uint8Array(G * G);
    const out = [], used = new Set();
    const free = (x, y, w, h) => { if (x < 0 || y < 0 || x + w > G || y + h > G) return false; for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) if (occ[j * G + i]) return false; return true; };
    const put = (img, x, y, w, h) => {
      for (let j = y; j < y + h; j++) for (let i = x; i < x + w; i++) occ[j * G + i] = 1;
      used.add(img); out.push({ img, x, y, w, h, r1: r(), r2: r(), r3: r(), r4: r() });
    };
    const want = { L: 2 + (r() < 0.35 ? 1 : 0), M: 4 + Math.floor(r() * 2), S: 4 + Math.floor(r() * 3), XS: 5 + Math.floor(r() * 3) };
    for (const k of ['L', 'M', 'S', 'XS']) {
      const arr = GR[k]; if (!arr.length) continue;
      const st = Math.floor(r() * arr.length);
      for (let i = 0; i < Math.min(want[k], arr.length); i++) {
        const img = arr[(st + i) % arr.length];
        if (used.has(img)) continue;
        place: for (const [w, h] of blocksOf(img)) {
          for (let t = 0; t < 40; t++) {
            const x = Math.floor(r() * (G - w + 1)), y = Math.floor(r() * (G - h + 1));
            if (free(x, y, w, h)) { put(img, x, y, w, h); break place; }
          }
        }
      }
    }
    const rest = shuffle(['M', 'S', 'XS'].flatMap(k => GR[k].filter(x => !used.has(x))), r);
    for (const img of rest) {
      for (const [w, h] of blocksOf(img)) {
        const spots = [];
        for (let y = 0; y <= G - h; y++) for (let x = 0; x <= G - w; x++) if (free(x, y, w, h)) spots.push(x, y);
        if (spots.length) { const p = Math.floor(r() * spots.length / 2) * 2; put(img, spots[p], spots[p + 1], w, h); break; }
      }
    }
    return out;
  }

  // ogni immagine sta dentro il suo blocco con una cornice nera fissa: non si toccano e non si sovrappongono mai
  const PAD = 0.07, SHRINK = { XS: 0.12, S: 0.1, M: 0.08, L: 0.05 };
  const tiles = new Map();          // riquadri montati
  const live = new Set();           // immagini montate (per l'ingrandimento)
  function mount(sx, sy) {
    const key = sx + ',' + sy;
    if (tiles.has(key)) return;
    const el = document.createElement('div');
    el.className = 'sc';
    el.style.left = (sx * SCW) + 'px'; el.style.top = (sy * SCW) + 'px';
    el.style.width = SCW + 'px'; el.style.height = SCW + 'px';
    const items = [];
    for (const b of layout(sx, sy)) {
      const x = b.img, bw = b.w * CELL, bh = b.h * CELL, pad = CELL * PAD, q = SHRINK[x.s] ?? 0.08;
      const aw = (bw - 2 * pad) * (1 - b.r1 * q), ah = (bh - 2 * pad) * (1 - b.r2 * q);
      const s = Math.min(aw / x.w, ah / x.h);
      const iw = x.w * s, ih = x.h * s;
      const left = pad + (bw - 2 * pad - iw) * b.r3, top = pad + (bh - 2 * pad - ih) * b.r4;
      const c = document.createElement('div'); c.className = 'c';
      c.style.left = (b.x * CELL + left).toFixed(1) + 'px'; c.style.top = (b.y * CELL + top).toFixed(1) + 'px';
      c.style.width = iw.toFixed(1) + 'px'; c.style.height = ih.toFixed(1) + 'px';
      const im = document.createElement('img');
      im.alt = ''; im.decoding = 'async'; im.draggable = false;
      im.addEventListener('load', () => im.classList.add('ok'), { once: true });
      srcOf(x).then(u => { im.src = u; }).catch(() => {});
      c.appendChild(im); el.appendChild(c);
      const it = { c, im, x, hi: false };
      c.__it = it;
      items.push(it);
    }
    world.appendChild(el);
    tiles.set(key, { el, items, sx, sy });
  }

  // camera: il punto del piano al centro dello schermo, e lo zoom
  const ZMIN = 0.6, ZMAX = 2.6;
  let camX = 0, camY = 0, vx = 0, vy = 0, Z = 1;
  const clampZ = z => Math.min(ZMAX, Math.max(ZMIN, z));
  function zoomAt(px, py, z) {                                   // zoom tenendo fermo il punto sotto il dito o il cursore
    z = clampZ(z);
    const k = 1 / Z - 1 / z;
    camX += (px - innerWidth / 2) * k; camY += (py - innerHeight / 2) * k;
    Z = z;
  }
  function update() {
    world.style.transform = `translate3d(${(innerWidth / 2).toFixed(1)}px,${(innerHeight / 2).toFixed(1)}px,0) scale(${Z.toFixed(4)}) translate3d(${(-camX).toFixed(2)}px,${(-camY).toFixed(2)}px,0)`;
    // monta i riquadri vicini, smonta i lontani
    const M = 220 / Z, hw = innerWidth / 2 / Z, hh = innerHeight / 2 / Z;
    const x0 = Math.floor((camX - hw - M) / SCW), x1 = Math.floor((camX + hw + M) / SCW);
    const y0 = Math.floor((camY - hh - M) / SCW), y1 = Math.floor((camY + hh + M) / SCW);
    for (let sy = y0; sy <= y1; sy++) for (let sx = x0; sx <= x1; sx++) mount(sx, sy);
    for (const [k, t] of tiles) if (t.sx < x0 - 1 || t.sx > x1 + 1 || t.sy < y0 - 1 || t.sy > y1 + 1) { t.el.remove(); tiles.delete(k); }
    live.clear();
    for (const t of tiles.values()) for (const it of t.items) live.add(it);
    settle();
  }

  // quando lo zoom si ferma: immagini nitide alla nuova scala, e versioni grandi per quelle ingrandite molto
  let settleT = 0, rasterZ = 1;
  function settle() {
    clearTimeout(settleT);
    settleT = setTimeout(() => {
      if (Math.abs(Z - rasterZ) > 0.01) {
        rasterZ = Z; world.style.willChange = 'auto';
        requestAnimationFrame(() => requestAnimationFrame(() => { world.style.willChange = 'transform'; }));
      }
      if (Z < 1.3) return;
      const dpr = devicePixelRatio || 1;
      for (const it of live) {
        if (it.hi || !it.x.H || !it.im.naturalWidth) continue;
        const r = it.c.getBoundingClientRect();
        if (r.right < 0 || r.left > innerWidth || r.bottom < 0 || r.top > innerHeight) continue;
        if (r.width * dpr <= it.im.naturalWidth * 1.2) continue;
        it.hi = true;
        sharpen(it.im, it.x, () => it.c.isConnected);
      }
    }, 260);
  }

  let raf = 0;
  const schedule = () => { if (!raf) raf = requestAnimationFrame(() => { raf = 0; update(); }); };
  function glide() {                                             // inerzia dopo il lancio
    if (Math.abs(vx) < 0.05 && Math.abs(vy) < 0.05) { vx = vy = 0; return; }
    camX -= vx / Z; camY -= vy / Z; vx *= 0.95; vy *= 0.95;
    update();
    requestAnimationFrame(glide);
  }
  let zGoal = 0, zP = [0, 0];                                     // zoom animato (tastiera): va verso zGoal
  function zoomTo(z, px = innerWidth / 2, py = innerHeight / 2) {
    const run = !zGoal;
    zGoal = clampZ(z); zP = [px, py];
    if (!run) return;
    const step = () => {
      if (!zGoal) return;
      const nz = Math.abs(zGoal - Z) < 0.004 ? zGoal : Z + (zGoal - Z) * 0.22;
      zoomAt(zP[0], zP[1], nz); update();
      if (nz === zGoal) zGoal = 0; else requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }

  // un dito o il mouse: trascina; due dita: zoom; un tocco senza movimento apre l'immagine
  const pts = new Map();
  let down = null, pinch = null, lastT = 0, lastX = 0, lastY = 0, moved = 0;
  const two = () => { const [a, b] = [...pts.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)) }; };
  const hint = document.getElementById('hint');
  let hinted = true;
  function hideHint() {
    if (!hinted) return;
    hinted = false; hint.classList.add('off');
    setTimeout(() => hint.remove(), 700);
  }
  addEventListener('keydown', hideHint, { once: true });
  plane.addEventListener('pointerdown', e => {
    hideHint();
    if (lb.classList.contains('open')) return;
    try { plane.setPointerCapture(e.pointerId); } catch (_) {}
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    vx = vy = 0;
    plane.classList.add('drag');
    zGoal = 0;
    if (pts.size >= 2) { const m = two(); pinch = { d: m.d, z: Z, x: m.x, y: m.y }; down = null; return; }
    down = { x: e.clientX, y: e.clientY };
    lastX = e.clientX; lastY = e.clientY; lastT = performance.now(); moved = 0;
  });
  plane.addEventListener('pointermove', e => {
    if (!pts.has(e.pointerId)) return;
    pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pinch && pts.size >= 2) {
      const m = two();
      camX -= (m.x - pinch.x) / Z; camY -= (m.y - pinch.y) / Z;
      pinch.x = m.x; pinch.y = m.y;
      zoomAt(m.x, m.y, pinch.z * m.d / pinch.d);
      schedule(); return;
    }
    if (!down) return;
    const dx = e.clientX - lastX, dy = e.clientY - lastY, now = performance.now(), dt = Math.max(1, now - lastT);
    camX -= dx / Z; camY -= dy / Z;
    vx = 0.8 * (dx * 16 / dt) + 0.2 * vx; vy = 0.8 * (dy * 16 / dt) + 0.2 * vy;
    lastX = e.clientX; lastY = e.clientY; lastT = now;
    moved = Math.max(moved, Math.hypot(e.clientX - down.x, e.clientY - down.y));
    schedule();
  });
  function up(e) {
    if (!pts.delete(e.pointerId)) return;
    if (pinch) {                                                 // fine dello zoom: il dito che resta continua a trascinare
      if (pts.size >= 2) { const m = two(); pinch = { d: m.d, z: Z, x: m.x, y: m.y }; return; }
      pinch = null; vx = vy = 0;
      if (pts.size === 1) { const p = [...pts.values()][0]; down = { x: p.x, y: p.y }; lastX = p.x; lastY = p.y; lastT = performance.now(); moved = 99; }
      else { down = null; plane.classList.remove('drag'); }
      return;
    }
    if (!down) return;
    plane.classList.remove('drag');
    if (moved < 6 && e.type === 'pointerup') {
      vx = vy = 0;
      const el = document.elementsFromPoint(e.clientX, e.clientY).find(n => n.classList && n.classList.contains('c'));
      if (el) open(el.__it);

    else vx = vy = 0;
    down = null;
  }
  plane.addEventListener('pointerup', up);
  plane.addEventListener('pointercancel', up);
  plane.addEventListener('wheel', e => {
    e.preventDefault();
    hideHint();
    vx = vy = 0;
    zGoal = 0;
    if (e.ctrlKey) zoomAt(e.clientX, e.clientY, Z * Math.exp(-Math.max(-30, Math.min(30, e.deltaY * (e.deltaMode === 1 ? 5 : 1))) * 0.01));   // pinch del trackpad o ctrl + rotella

      camY += (e.shiftKey && !e.deltaX ? 0 : e.deltaY) * k;
    }
    schedule();
  }, { passive: false });
  // Safari su Mac: il pinch del trackpad arriva come "gesture"
  let gz = 1;
  addEventListener('gesturestart', e => { e.preventDefault(); gz = lb.classList.contains('open') ? Zs : Z; }, { passive: false });
  addEventListener('gesturechange', e => {
    e.preventDefault();
    if (pts.size >= 2 || lbPts.size >= 2) return;                // sul telefono lo zoom lo fanno già le due dita
    if (lb.classList.contains('open')) { if (big && !busy) zoomIn(gz * e.scale, e.clientX || innerWidth / 2, e.clientY || innerHeight / 2, false); return; }
    zoomAt(e.clientX || innerWidth / 2, e.clientY || innerHeight / 2, gz * e.scale); schedule();
  }, { passive: false });
  addEventListener('gestureend', e => e.preventDefault(), { passive: false });
  addEventListener('keydown', e => {
    if (lb.classList.contains('open')) return;
    if (e.key === '+' || e.key === '=') { e.preventDefault(); zoomTo((zGoal || Z) * 1.3); return; }
    if (e.key === '-' || e.key === '_') { e.preventDefault(); zoomTo((zGoal || Z) / 1.3); return; }
    if (e.key === '0') { e.preventDefault(); zoomTo(1); return; }
    const st = 140, map = { ArrowLeft: [-st, 0], ArrowRight: [st, 0], ArrowUp: [0, -st], ArrowDown: [0, st] };
    if (map[e.key]) { e.preventDefault(); vx = -map[e.key][0] / 8; vy = -map[e.key][1] / 8; requestAnimationFrame(glide); }
  });
  addEventListener('resize', () => {
    const old = SCW; sizes();
    if (SCW !== old) { for (const t of tiles.values()) t.el.remove(); tiles.clear(); camX *= SCW / old; camY *= SCW / old; }
    if (big && !busy) { resetZoom(); big.style.transition = 'none'; setT(big, fitRect(cur.x.w, cur.x.h), cur.x.w); showGo(cur); }
    update();
  });
  update();

  // ingrandimento: vola dal tappeto al centro; scorri di lato per le vicine, in alto o in basso per chiudere
  let cur = null, big = null, busy = false, seq = [], pos = -1;
  const ease = 'cubic-bezier(.2,.75,.15,1)';
  function fitRect(w, h) {
    const m = 16, B = 64;                                       // margine e spazio per "vai a"
    const s = Math.min((innerWidth - 2 * m) / w, (innerHeight - 2 * m - B) / h);
    const W = w * s, H = h * s;
    return { x: (innerWidth - W) / 2, y: (innerHeight - H - B) / 2, w: W, h: H };
  }
  function setT(el, r, w) { el.style.transform = `translate(${r.x}px,${r.y}px) scale(${r.w / w})`; }
  function showGo(it) {
    const url = pageUrl(it.x);
    if (!url) { goBtn.classList.remove('on'); return; }
    const r = fitRect(it.x.w, it.x.h);
    goBtn.href = url; goBtn.textContent = it.x.p || ''; goBtn.setAttribute('aria-label', 'vai a ' + (it.x.p || ''));
    goBtn.style.top = (r.y + r.h + 16) + 'px';
    goBtn.classList.add('on');
  }
  const hideGo = () => goBtn.classList.remove('on');
  function makeBig(it) {
    const el = new Image();
    el.className = 'big'; el.alt = '';
    el.src = it.im.currentSrc || it.im.src;                      // subito la versione leggera, poi quella grande
    sharpen(el, it.x, () => el.isConnected);
    el.style.width = it.x.w + 'px'; el.style.height = it.x.h + 'px';
    lb.appendChild(el);
    return el;
  }
  function onScreen(it) { const r = it.c.getBoundingClientRect(); return r.right > 0 && r.left < innerWidth && r.bottom > 0 && r.top < innerHeight; }
  function open(it) {
    if (busy || !it) return;
    busy = true; cur = it; resetZoom();
    // sequenza per scorrere: le immagini visibili, in ordine di lettura
    seq = [...live].filter(onScreen).sort((a, b) => { const ra = a.c.getBoundingClientRect(), rb = b.c.getBoundingClientRect(); return (Math.round(ra.top / 80) - Math.round(rb.top / 80)) || (ra.left - rb.left); });
    pos = seq.indexOf(it);
    const from = it.im.getBoundingClientRect();
    big = makeBig(it);
    big.style.transition = 'none';
    setT(big, { x: from.left, y: from.top, w: from.width }, it.x.w);
    it.im.style.visibility = 'hidden';
    lb.classList.add('open'); lb.setAttribute('aria-hidden', 'false'); document.body.classList.add('lbopen');
    requestAnimationFrame(() => requestAnimationFrame(() => {
      big.style.transition = `transform .55s ${ease}`;
      setT(big, fitRect(it.x.w, it.x.h), it.x.w);
      setTimeout(() => { busy = false; showGo(it); }, 560);
    }));
  }
  function close() {
    if (busy || !big) return;
    busy = true; hideGo(); clearTimeout(tapTimer); resetZoom();
    const it = cur, r = it.im.getBoundingClientRect();
    big.style.transition = `transform .45s ${ease}, opacity .35s ease`;
    if (it.c.isConnected && onScreen(it)) setT(big, { x: r.left, y: r.top, w: r.width }, it.x.w); else big.style.opacity = '0';
    lb.classList.remove('open'); lb.setAttribute('aria-hidden', 'true'); document.body.classList.remove('lbopen');
    setTimeout(() => { it.im.style.visibility = ''; big.remove(); big = null; busy = false; }, 460);
  }
  function go(dir) {
    if (busy || !big || !seq.length) return;
    const np = pos + dir;
    if (np < 0 || np >= seq.length) return;
    busy = true; hideGo(); resetZoom();
    const old = big, oldIt = cur, oldR = fitRect(oldIt.x.w, oldIt.x.h);
    old.style.transition = `transform .4s ${ease}, opacity .3s ease`;
    setT(old, { x: oldR.x - dir * innerWidth * 0.6, y: oldR.y, w: oldR.w }, oldIt.x.w);
    old.style.opacity = '0';
    oldIt.im.style.visibility = '';
    pos = np; cur = seq[pos];
    const it = cur;
    it.im.style.visibility = 'hidden';
    big = makeBig(it);
    const r = fitRect(it.x.w, it.x.h);
    big.style.transition = 'none'; big.style.opacity = '0';
    setT(big, { x: r.x + dir * innerWidth * 0.6, y: r.y, w: r.w }, it.x.w);
    requestAnimationFrame(() => requestAnimationFrame(() => {
      big.style.transition = `transform .45s ${ease}, opacity .35s ease`;
      big.style.opacity = '1'; setT(big, r, it.x.w);
      setTimeout(() => { old.remove(); busy = false; showGo(it); }, 460);
    }));
  }
  // dentro l'immagine ingrandita: due dita, doppio tocco, rotella o + / - per zoomare; con lo zoom un dito sposta
  let Zs = 1, Zr = null;                                        // fattore di zoom e rettangolo mostrato
  const ZMAXI = 6;
  const baseRect = () => fitRect(cur.x.w, cur.x.h);
  function clampRect(r) {
    const W = innerWidth, H = innerHeight;
    r.x = r.w <= W ? (W - r.w) / 2 : Math.min(0, Math.max(W - r.w, r.x));
    r.y = r.h <= H ? (H - r.h) / 2 : Math.min(0, Math.max(H - r.h, r.y));
    return r;
  }
  function showRect(r, anim) { big.style.transition = anim ? `transform .3s ${ease}` : 'none'; setT(big, r, cur.x.w); }
  function zoomIn(z, px, py, anim) {
    if (!big || !cur) return;
    const R = baseRect();
    z = Math.max(1, Math.min(ZMAXI, z));
    if (z <= 1.01) {
      const was = Zs > 1;
      Zs = 1; Zr = null; showRect(R, anim); lb.classList.remove('zoomed');
      if (was) setTimeout(() => { if (Zs === 1 && big && !busy) showGo(cur); }, anim ? 320 : 0);
      return;
    }
    const c = Zr || R, k = (R.w * z) / c.w;
    Zr = clampRect({ x: px - (px - c.x) * k, y: py - (py - c.y) * k, w: R.w * z, h: R.h * z });
    Zs = z; hideGo(); lb.classList.add('zoomed'); showRect(Zr, anim);
  }
  function panBy(ddx, ddy) { if (!Zr) return; Zr = clampRect({ ...Zr, x: Zr.x + ddx, y: Zr.y + ddy }); showRect(Zr, false); }
  const resetZoom = () => { Zs = 1; Zr = null; lb.classList.remove('zoomed'); };

  const lbPts = new Map();
  let sx = 0, sy = 0, dx = 0, dy = 0, lx = 0, ly = 0, drag = false, lbPinch = null;
  let lastTap = 0, tapX = 0, tapY = 0, tapTimer = 0;
  const two2 = () => { const [a, b] = [...lbPts.values()]; return { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2, d: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)) }; };
  lb.addEventListener('pointerdown', e => {
    if (!big || busy || e.target.closest('#go')) return;
    try { lb.setPointerCapture(e.pointerId); } catch (_) {}
    lbPts.set(e.pointerId, { x: e.clientX, y: e.clientY });

      drag = false; const m = two2(); lbPinch = { d: m.d, z: Zs, x: m.x, y: m.y }; hideGo(); return;
    }
    hideGo(); drag = true; sx = lx = e.clientX; sy = ly = e.clientY; dx = dy = 0; big.style.transition = 'none';
  });
  lb.addEventListener('pointermove', e => {
    if (!lbPts.has(e.pointerId)) return;
    lbPts.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (lbPinch && lbPts.size >= 2) {
      const m = two2();
      zoomIn(lbPinch.z * m.d / lbPinch.d, m.x, m.y, false);
      panBy(m.x - lbPinch.x, m.y - lbPinch.y); lbPinch.x = m.x; lbPinch.y = m.y;
      return;
    }
    if (!drag || !big) return;
    dx = e.clientX - sx; dy = e.clientY - sy;
    if (Zs > 1) { panBy(e.clientX - lx, e.clientY - ly); lx = e.clientX; ly = e.clientY; return; }
    const r = baseRect(), vert = Math.abs(dy) > Math.abs(dx);
    const k = vert ? 1 - Math.min(Math.abs(dy) / innerHeight, 0.5) : 1;
    setT(big, { x: r.x + (vert ? 0 : dx) + r.w * (1 - k) / 2, y: r.y + (vert ? dy : 0) + r.h * (1 - k) / 2, w: r.w * k }, cur.x.w);
    lbBg.style.opacity = vert ? String(0.96 * (1 - Math.min(Math.abs(dy) / (innerHeight * 0.6), 0.9))) : '';
  });
  function tapAt(x, y) {
    const now = performance.now();
    if (now - lastTap < 300 && Math.hypot(x - tapX, y - tapY) < 40) {   // doppio tocco: avvicina o torna intera
      clearTimeout(tapTimer); lastTap = 0;
      zoomIn(Zs > 1 ? 1 : 2.5, x, y, true);
      return;
    }
    lastTap = now; tapX = x; tapY = y;
    clearTimeout(tapTimer);
    tapTimer = setTimeout(() => { if (Zs === 1) close(); }, 280);   // un tocco solo: chiude (se non c'è zoom)
  }
  function endDrag(e) {
    if (!lbPts.delete(e.pointerId)) return;
    if (lbPinch) {
      if (lbPts.size >= 2) { const m = two2(); lbPinch = { d: m.d, z: Zs, x: m.x, y: m.y }; return; }
      lbPinch = null;
      if (Zs < 1.05) zoomIn(1, 0, 0, true);
      if (lbPts.size === 1) { const p = [...lbPts.values()][0]; drag = true; sx = lx = p.x; sy = ly = p.y; dx = dy = 99; }
      else drag = false;
      return;
    }
    if (!drag || !big) return;
    drag = false; lbBg.style.opacity = '';
    if (Math.abs(dx) < 8 && Math.abs(dy) < 8 && e.type === 'pointerup') { if (Zs === 1) showRect(baseRect(), false); tapAt(e.clientX, e.clientY); return; }
    if (Zs > 1) return;                                         // fine dello spostamento dentro lo zoom
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 50) { go(dx < 0 ? 1 : -1); return; }
    if (Math.abs(dy) > 80) { close(); return; }
    showRect(baseRect(), true);
    setTimeout(() => { if (Zs === 1) showGo(cur); }, 360);
  }
  lb.addEventListener('pointerup', endDrag);
  lb.addEventListener('pointercancel', endDrag);
  lb.addEventListener('wheel', e => {
    if (!big || busy) return;
    e.preventDefault();
    const mouse = e.deltaMode === 1 || Math.abs(e.deltaY) >= 50;
    if (e.ctrlKey || mouse) zoomIn(Zs * Math.exp(-Math.max(-30, Math.min(30, e.deltaY * (e.deltaMode === 1 ? 5 : 1))) * 0.012), e.clientX, e.clientY, false);

  }, { passive: false });

    if (!big) return;
    if (e.key === 'Escape') { if (Zs > 1) zoomIn(1, 0, 0, true); else close(); return; }
    if (e.key === '+' || e.key === '=') { zoomIn(Zs * 1.5, innerWidth / 2, innerHeight / 2, true); return; }
    if (e.key === '-' || e.key === '_') { zoomIn(Zs / 1.5, innerWidth / 2, innerHeight / 2, true); return; }
    if (e.key === '0') { zoomIn(1, 0, 0, true); return; }

  });
})();
